# Conexao com o MongoDB (cluster fornecido pelo professor)
spring.data.mongodb.uri=mongodb+srv://alunos:semestudareureprovarei@cluster0.tibnnz0.mongodb.net/?appName=Cluster0
# Banco proprio deste projeto: o cluster e compartilhado pela turma e o banco "pizzaria"
# original mistura usuarios, pedidos e auditoria de todos os alunos.
spring.data.mongodb.database=${PEDIUPATRAO_BANCO:pizzaria_xetti}
spring.data.mongodb.auto-index-creation=true

# Senha inicial dos usuarios de demonstracao (admin, gerente01, atendente01).
# Pode ser trocada por variavel de ambiente sem mexer no codigo.
pediupatrao.demo.senha-inicial=${PEDIUPATRAO_SENHA_DEMO:Patrao#2026}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Nao expor detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.umc.pediupatrao=INFO
