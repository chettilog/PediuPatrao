<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <div id="aviso" class="alert alert-danger d-none"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Só controla a exibição dos botões; a API recusa edição/exclusão para quem não é ATENDENTE -->
    <script th:inline="javascript">
        const PODE_EDITAR = /*[[${podeEditar}]]*/ false;
    </script>
    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');
        const aviso = document.getElementById('aviso');

        // Evita que um nome com HTML/JS seja executado na tela (XSS)
        function esc(texto) {
            const div = document.createElement('div');
            div.textContent = texto == null ? '' : String(texto);
            return div.innerHTML;
        }

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro, cliente.numero, cliente.complemento,
                cliente.bairro, cliente.cidade, cliente.estado
            ].filter(p => p && p.trim() !== '');
            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        function mostrarAviso(msg) {
            aviso.textContent = msg;
            aviso.classList.remove('d-none');
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            if (!response.ok) {
                mostrarAviso('Não foi possível carregar os clientes (HTTP ' + response.status + ').');
                return;
            }
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const acoes = PODE_EDITAR ? `
                        <a href="/clientes/editar/${esc(cliente.id)}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <button class="btn btn-sm btn-outline-danger" data-id="${esc(cliente.id)}">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>` : '<span class="text-muted small">somente consulta</span>';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${esc(cliente.nome || '—')}</td>
                    <td>${esc(cliente.telefone || '—')}</td>
                    <td>${esc(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">${acoes}</td>`;
                tabelaClientes.appendChild(row);
            });

            tabelaClientes.querySelectorAll('button[data-id]').forEach(btn =>
                btn.addEventListener('click', () => excluirCliente(btn.dataset.id)));
        }

        async function excluirCliente(id) {
            if (!confirm('Tem certeza que deseja excluir este cliente?')) {
                return;
            }
            // o token CSRF é incluído automaticamente por js/csrf.js
            const response = await fetch(`${API_URL}/${encodeURIComponent(id)}`, { method: 'DELETE' });
            if (response.ok) {
                aviso.classList.add('d-none');
                carregarClientes();
            } else {
                const corpo = await response.json().catch(() => ({}));
                mostrarAviso(corpo.erro || ('Erro ao excluir o cliente (HTTP ' + response.status + ').'));
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
