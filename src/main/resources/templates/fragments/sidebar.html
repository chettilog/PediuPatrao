<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    </head>
    <body>
        <!--
            Os links abaixo aparecem conforme o perfil (sec:authorize) apenas por conveniencia.
            A protecao de verdade esta no SecurityConfig e nos services (@PreAuthorize).
        -->
        <div th:fragment="sidebar">
            <div id="sidebar" class="d-flex flex-column">
                <h4 class="text-center py-3 mb-0">Pediu Patrão</h4>

                <div class="text-center small pb-3 border-bottom border-secondary" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-circle"></i>
                    <span sec:authentication="name">usuario</span><br>
                    <span class="badge bg-warning text-dark" sec:authorize="hasRole('ADMIN')">ADMIN</span>
                    <span class="badge bg-info text-dark" sec:authorize="hasRole('GERENTE')">GERENTE</span>
                    <span class="badge bg-light text-dark" sec:authorize="hasRole('ATENDENTE')">ATENDENTE</span>
                </div>

                <ul class="nav flex-column mt-2">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house"></i><span class="d-none d-md-inline">&nbsp;Home</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person-raised-hand"></i><span class="d-none d-md-inline">&nbsp;Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/pedidos}">
                            <i class="bi bi-bag"></i><span class="d-none d-md-inline">&nbsp;Pedidos</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('GERENTE','ATENDENTE')">
                        <a class="nav-link" th:href="@{/pedidos/novo}">
                            <i class="bi bi-plus-circle"></i><span class="d-none d-md-inline">&nbsp;Novo pedido</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/produtos}">
                            <i class="bi bi-boxes"></i><span class="d-none d-md-inline">&nbsp;Cardápio</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','GERENTE')">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-journal-text"></i><span class="d-none d-md-inline">&nbsp;Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/usuarios}">
                            <i class="bi bi-people-fill"></i><span class="d-none d-md-inline">&nbsp;Usuários</span>
                        </a>
                    </li>
                </ul>

                <form class="mt-auto p-3" th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </button>
                </form>
            </div>
        </div>
    </body>
</html>
