<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Cardápio</title>
</head>
<body>

<div th:fragment="content">

    <h2 class="fw-bold mb-4"><i class="bi bi-boxes me-2 text-primary"></i>Cardápio</h2>

    <!-- Cadastro/edição: só GERENTE (backend também valida) -->
    <div class="card shadow-sm mb-4" style="max-width: 760px;" sec:authorize="hasRole('GERENTE')">
        <div class="card-body">
            <h6 class="fw-bold" th:text="${produto.id != null} ? 'Editar produto' : 'Novo produto'"></h6>
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="row g-2 align-items-end">
                <input type="hidden" th:field="*{id}">
                <div class="col-md-4">
                    <label class="form-label small" for="nome">Nome</label>
                    <input type="text" id="nome" class="form-control form-control-sm" th:field="*{nome}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small" for="tipo">Tipo</label>
                    <select id="tipo" class="form-select form-select-sm" th:field="*{tipo}" required>
                        <option value="">Selecione</option>
                        <option th:each="t : ${tiposProduto}"
                                th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small" for="preco">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control form-control-sm" th:field="*{preco}"
                           step="0.01" min="0.01" required>
                </div>
                <div class="col-md-1">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{ativo}">
                        <label class="form-check-label small" th:for="${#ids.prev('ativo')}">Ativo</label>
                    </div>
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-success btn-sm flex-fill">Salvar</button>
                    <a th:if="${produto.id != null}" th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm">X</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-3">Nome</th>
                        <th>Tipo</th>
                        <th class="text-end">Preço</th>
                        <th>Ativo</th>
                        <th sec:authorize="hasRole('GERENTE')"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-4">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="p : ${produtos}">
                        <td class="ps-3" th:text="${p.nome}"></td>
                        <td th:text="${p.tipo}"></td>
                        <td class="text-end" th:text="${@fmt.moeda(p.preco)}"></td>
                        <td th:text="${p.ativo != null and p.ativo} ? 'Sim' : 'Não'"></td>
                        <td class="text-end pe-3" sec:authorize="hasRole('GERENTE')">
                            <a th:href="@{/produtos(editar=${p.id})}" class="btn btn-sm btn-outline-primary">Editar</a>
                            <form th:action="@{/produtos/{id}/excluir(id=${p.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Excluir este produto do cardápio?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Excluir</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
